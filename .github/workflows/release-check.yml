name: Release check

# A release tag must name the version the CMake project declares -- which also
# sets libiov2's SOVERSION and the packages' version files -- and have its own
# section in both languages of CHANGELOG.md. The book line's tags (book-v1.*) do
# not start with v, so this never sees them.
on:
  push:
    tags: [ 'v*' ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: The tag, the CMake project and CHANGELOG name one version
      run: |
        tag="${GITHUB_REF_NAME#v}"
        # A pre-release such as 2.0.0-beta.1 declares 2.0.0 in CMake.
        core="${tag%%-*}"
        if ! printf '%s\n' "$core" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
          echo "[!] $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]"; exit 1
        fi
        project=$(sed -n '/^project(IOv2/,/)/s/^[[:space:]]*VERSION[[:space:]]*\([0-9.]*\).*/\1/p' CMakeLists.txt)
        if [ "$project" != "$core" ]; then
          echo "[!] the tag is $tag, but CMakeLists.txt declares VERSION $project"; exit 1
        fi
        re=$(printf '%s' "$tag" | sed 's/[.]/\\./g')
        n=$(grep -c "^### \[$re\] - [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}$" CHANGELOG.md || true)
        if [ "$n" -ne 2 ]; then
          echo "[!] CHANGELOG.md has $n headings '### [$tag] - YYYY-MM-DD', not one per language"; exit 1
        fi
        echo "OK: $GITHUB_REF_NAME, CMakeLists.txt and CHANGELOG.md name one version"
