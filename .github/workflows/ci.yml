name: C++ CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Manual trigger. Without it the only ways to get a run are pushing to a
  # default branch or opening a PR at one, so work on a feature branch is
  # unverified until it is already up for review -- exactly when a red result
  # is most expensive to act on.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Both compilers run out of the one image; sharing a base is what keeps
        # clang++ on the same libstdc++ that g++ uses.
        compiler: [ g++, clang++ ]

    container:
      image: ghcr.io/liwei-cpp/iov2-ci-gcc15:latest

    env:
      # One representative per axis the library actually branches on, not a
      # sample of the ~300 locales the image ships: a second locale of the same
      # shape re-runs the same code path, costing time and reporting nothing.
      # Each entry below differs from every other in at least one field that
      # the facets read.
      #
      #   C.UTF-8           UTF-8 charmap with C conventions: no thousands
      #                     separator at all, sign position unspecified
      #   en_US.UTF-8       '.' decimal, ',' thousands, sign before the value
      #   zh_CN.UTF-8       same shape, different sign position, non-Latin --
      #                     and the maintainer's own default, the locale where
      #                     a difference was once misdiagnosed as a defect
      #   de_DE.UTF-8       ',' decimal and '.' thousands, i.e. the two
      #                     swapped: catches anything that hard-codes '.'
      #   de_CH.UTF-8       '.' decimal but a U+2019 thousands separator, i.e.
      #                     multibyte -- this is what drives the "separator
      #                     does not fit in one char" fallback that drops
      #                     grouping entirely
      #   fr_CA.UTF-8       the same fallback with U+202F, and reached through
      #                     the monetary facet rather than the numeric one
      #   ps_AF.UTF-8       multibyte *decimal point*: the one case where the
      #                     fallback substitutes a character instead of
      #                     dropping one, and it differs narrow vs wide
      #   tr_TR.UTF-8       dotless i, so toupper('i') != 'I' -- breaks any
      #                     assumption that ctype is ASCII underneath
      #   en_HK.UTF-8       n_sign_posn=0, so negative money is parenthesised
      #   zh_CN.GBK         non-UTF-8, multibyte charmap
      #   cs_CZ.ISO-8859-2  non-UTF-8 single-byte charmap whose separator is
      #                     one high byte (0xA0), which is negative once
      #                     stored in a signed char
      #   ru_RU.KOI8-R      the same, with a different high byte (0x9A)
      #
      # Plain C is absent because the container sets no LANG, so every other
      # job in this workflow already runs there.
      IOV2_LOCALES: >-
        C.UTF-8 en_US.UTF-8 zh_CN.UTF-8 de_DE.UTF-8
        de_CH.UTF-8 fr_CA.UTF-8 ps_AF.UTF-8 tr_TR.UTF-8
        en_HK.UTF-8 zh_CN.GBK cs_CZ.ISO-8859-2 ru_RU.KOI8-R
      # A sanitizer run costs several times a plain one, so this is the three
      # locales where a sanitizer has something specific to say: a separator
      # that is a single high byte in a signed char, a non-UTF-8 multibyte
      # charmap, and the multibyte-decimal-point fallback.
      IOV2_LOCALES_SAN: >-
        cs_CZ.ISO-8859-2 zh_CN.GBK ps_AF.UTF-8

    steps:
    - uses: actions/checkout@v6

    - name: Run tests (Release)
      run: |
        cd test
        make -j$(nproc) test CXX=${{ matrix.compiler }} MODE=release

    - name: Run tests (Release) across locales
      run: |
        cd test
        # No rebuild: this re-runs the binaries the previous step just built,
        # because the only variable here is the process locale. Compiling once
        # and re-running is what makes several locales affordable at all.
        #
        # Why this exists: nothing else in the workflow leaves the C locale --
        # the container sets no LANG, and the install-paths job pins LC_ALL=C.
        # So a green pipeline used to say nothing about any other locale, while
        # the library's facets are precisely the code that reads them.
        for loc in $IOV2_LOCALES; do
          # glibc does not fail on an unknown locale: it warns on stderr and
          # silently falls back to C. Without this check, losing locales-all
          # from the image would turn the whole matrix into N more C runs --
          # green, and testing nothing.
          if [ -n "$(LC_ALL="$loc" locale charmap 2>&1 >/dev/null)" ]; then
            echo "[!] locale $loc is not available in this image"; exit 1
          fi
          echo "=== LC_ALL=$loc (charmap $(LC_ALL="$loc" locale charmap))"
          for t in bin_release/test_*; do
            LC_ALL="$loc" "$t" > /dev/null \
              || { echo "[!] $t failed under LC_ALL=$loc"; exit 1; }
          done
        done

    - name: Run tests (Sanitizers)
      run: |
        cd test
        make -j$(nproc) test CXX=${{ matrix.compiler }} MODE=sanitizer
      env:
        ASAN_OPTIONS: halt_on_error=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    - name: Run tests (Sanitizers) across locales
      run: |
        cd test
        # Again no rebuild -- the sanitizer binaries from the previous step are
        # reused. This pairing is the point: the locale-dependent paths are
        # where a stray byte becomes an out-of-range index, and only a
        # sanitizer run reports that rather than quietly producing wrong text.
        for loc in $IOV2_LOCALES_SAN; do
          if [ -n "$(LC_ALL="$loc" locale charmap 2>&1 >/dev/null)" ]; then
            echo "[!] locale $loc is not available in this image"; exit 1
          fi
          echo "=== LC_ALL=$loc (charmap $(LC_ALL="$loc" locale charmap))"
          for t in bin_sanitizer/test_*; do
            LC_ALL="$loc" "$t" > /dev/null \
              || { echo "[!] $t failed under LC_ALL=$loc"; exit 1; }
          done
        done
      env:
        ASAN_OPTIONS: halt_on_error=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    - name: Run memory check (Valgrind)
      run: |
        cd test
        make valgrind CXX=${{ matrix.compiler }} MODE=release

  thread-safety:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/liwei-cpp/iov2-ci-gcc15:latest
    steps:
    - uses: actions/checkout@v6

    - name: Run concurrency tests under ThreadSanitizer
      run: |
        # Only the concur module is built here. It collects every test that actually
        # runs threads -- TSan has nothing to observe in a single-threaded test, so
        # building the rest would cost minutes to inspect executions that cannot race.
        # Devices/converters/facets document concurrency as a higher-level concern and
        # are deliberately out of scope.
        #
        # Repeated because a race is only reported when the schedule actually exercises
        # it -- a single clean run is weaker evidence than several. The reverse direction
        # is reliable: TSan is a happens-before detector and does not invent races, so a
        # red here is a real defect rather than CI flake.
        cd test
        make -j$(nproc) concur MODE=tsan
        for i in $(seq 1 10); do
          echo "--- ThreadSanitizer run $i"
          bin_tsan/test_concur > /dev/null
        done
      env:
        TSAN_OPTIONS: halt_on_error=1:exitcode=66:history_size=7

  coverage:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/liwei-cpp/iov2-ci-gcc15:latest
    steps:
    - uses: actions/checkout@v6

    - name: Generate Coverage Report
      run: |
        cd test
        # 1. Build and run all tests in coverage mode
        make -j$(nproc) test MODE=coverage
        
        # 2. Capture coverage data
        lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch --ignore-errors inconsistent --ignore-errors negative
        
        # 3. Filter to include ONLY the 'include' directory and exclude system/test code
        lcov --extract coverage.info '*/include/*' --output-file coverage.info --ignore-errors unused
        
        # 4. Print summary to console for quick check
        lcov --list coverage.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: test/coverage.info
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}

  install-paths:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/liwei-cpp/iov2-ci-gcc15:latest
    steps:
    - uses: actions/checkout@v6

    - name: Build the shared library
      run: make shared

    - name: Verify no unexpected runtime dependencies
      run: |
        # iov2_objects.cpp pulls in none of the optional converters, so the .so
        # must not depend on zlib/Botan.
        if readelf -d libiov2.so | grep -Eiq 'libz|libbotan'; then
          echo "libiov2.so unexpectedly links zlib/Botan"; exit 1
        fi

    - name: Install the shared library
      run: |
        make install-shared PREFIX=/opt/iov2
        # install-shared flips the switch in the shipped header.
        grep -q '^#define IOV2_SHARED 1' /opt/iov2/include/common/iov2_export.h

    - name: Run the full test suite against the installed shared library
      run: |
        # Consume libiov2 the real-user way: installed headers (switch already on)
        # + pkg-config for cflags/libs. Drop -I../include so only the installed
        # headers are used. The repo test/Makefile is not modified.
        export PKG_CONFIG_PATH=/opt/iov2/lib/pkgconfig
        export LD_LIBRARY_PATH=/opt/iov2/lib
        export LC_ALL=C   # tests assume the C locale (default boolalpha names, etc.)
        cd test
        make -j$(nproc) test \
          OBJ_DIR=obj_shared BIN_DIR=bin_shared \
          COMP_FLAGS="-Wall -Werror -Wshadow -std=c++23 -g -O2 -I. -I/usr/include/botan-2 $(pkg-config --cflags iov2-shared)" \
          LINK_FLAGS="$(pkg-config --libs iov2-shared) -lz -lbotan-2"

    - name: Install + consume in header-only mode (via pkg-config iov2)
      run: |
        # The header-only install path (make install + iov2.pc) is distinct from the
        # -I include path the build/coverage jobs use; exercise it so the install
        # target, iov2.pc, and the shipped switch-off header stay covered.
        make install PREFIX=/opt/iov2-ho
        # Header-only: the shipped switch must stay commented out.
        if grep -q '^#define IOV2_SHARED 1' /opt/iov2-ho/include/common/iov2_export.h; then
          echo "header-only install must NOT flip the IOV2_SHARED switch"; exit 1
        fi
        printf '%s\n' '#include <io/objects/out_impl.h>' \
          'int main() { IOv2::cout << "iov2 header-only ok\n"; return 0; }' > consumer_ho.cpp
        export PKG_CONFIG_PATH=/opt/iov2-ho/lib/pkgconfig
        g++ -std=c++23 -D_POSIX_C_SOURCE=200809L $(pkg-config --cflags iov2) \
            consumer_ho.cpp -o consumer_ho $(pkg-config --libs iov2)
        ./consumer_ho | grep -q 'iov2 header-only ok'

    - name: Run the full test suite against the installed header-only library
      run: |
        export PKG_CONFIG_PATH=/opt/iov2-ho/lib/pkgconfig
        export LC_ALL=C
        cd test
        make -j$(nproc) test \
          OBJ_DIR=obj_ho BIN_DIR=bin_ho \
          COMP_FLAGS="-Wall -Werror -Wshadow -std=c++23 -g -O2 -I. -I/usr/include/botan-2 $(pkg-config --cflags iov2)" \
          LINK_FLAGS="-lz -lbotan-2"

  clang-tidy:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/liwei-cpp/iov2-ci-gcc15:latest
    steps:
    - uses: actions/checkout@v6

    - name: Run clang-tidy
      run: |
        # Use default clang-tidy from the image (which will be a recent version)
        clang-tidy $(find include/common include/device include/cvt include/facet include/locale include/io/utilities -name '*.h') \
          include/io/streambuf.h include/io/streambuf_iterator.h include/io/io_concepts.h include/io/io_base.h \
          --checks='bugprone-*,performance-*,modernize-*,cppcoreguidelines-*,-modernize-use-trailing-return-type,-cppcoreguidelines-avoid-magic-numbers,-cppcoreguidelines-pro-bounds-pointer-arithmetic,-cppcoreguidelines-pro-bounds-constant-array-index,-cppcoreguidelines-avoid-non-const-global-variables,-cppcoreguidelines-pro-bounds-avoid-unchecked-container-access,-clang-diagnostic-pragma-once-outside-header' \
          --warnings-as-errors='bugprone-*' \
          -- -std=c++23 -x c++ -I include -I /usr/include -I /usr/include/botan-2
