name: C++ CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Manual trigger. Without it the only ways to get a run are pushing to a
  # default branch or opening a PR at one, so work on a feature branch is
  # unverified until it is already up for review -- exactly when a red result
  # is most expensive to act on.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The test suite is built and run by CMake/CTest, and these six contexts --
# build (g++), build (clang++), thread-safety, coverage, install-paths,
# clang-tidy -- are the ones main's ruleset requires. clang-tidy reads the
# library headers and belongs to no build system; the other five moved off
# test/Makefile, which no longer exists.
jobs:
  build:
    # Explicit, because the check context is this name and main's ruleset
    # spells it with the compiler binary while the presets are named after the
    # toolchain. Without it the matrix would produce "build (gcc, g++)".
    name: build (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Both compilers run out of the one image; sharing a base is what keeps
        # clang++ on the same libstdc++ that g++ uses.
        include:
          - preset: gcc
            cxx: g++
          - preset: clang
            cxx: clang++

    container:
      image: ghcr.io/liwei-cpp/iov2-ci-gcc15:latest

    env:
      # One representative per axis the library actually branches on, not a
      # sample of the ~300 locales the image ships: a second locale of the same
      # shape re-runs the same code path, costing time and reporting nothing.
      # Each entry below differs from every other in at least one field that
      # the facets read.
      #
      #   C.UTF-8           UTF-8 charmap with C conventions: no thousands
      #                     separator at all, sign position unspecified
      #   en_US.UTF-8       '.' decimal, ',' thousands, sign before the value
      #   zh_CN.UTF-8       same shape, different sign position, non-Latin --
      #                     and the maintainer's own default, the locale where
      #                     a difference was once misdiagnosed as a defect
      #   de_DE.UTF-8       ',' decimal and '.' thousands, i.e. the two
      #                     swapped: catches anything that hard-codes '.'
      #   de_CH.UTF-8       '.' decimal but a U+2019 thousands separator, i.e.
      #                     multibyte -- this is what drives the "separator
      #                     does not fit in one char" fallback that drops
      #                     grouping entirely
      #   fr_CA.UTF-8       the same fallback with U+202F, and reached through
      #                     the monetary facet rather than the numeric one
      #   ps_AF.UTF-8       multibyte *decimal point*: the one case where the
      #                     fallback substitutes a character instead of
      #                     dropping one, and it differs narrow vs wide
      #   tr_TR.UTF-8       dotless i, so toupper('i') != 'I' -- breaks any
      #                     assumption that ctype is ASCII underneath
      #   en_HK.UTF-8       n_sign_posn=0, so negative money is parenthesised
      #   zh_CN.GBK         non-UTF-8, multibyte charmap
      #   cs_CZ.ISO-8859-2  non-UTF-8 single-byte charmap whose separator is
      #                     one high byte (0xA0), which is negative once
      #                     stored in a signed char
      #   ru_RU.KOI8-R      the same, with a different high byte (0x9A)
      #
      # Plain C is absent because the container sets no LANG, so every other
      # job in this workflow already runs there.
      IOV2_LOCALES: >-
        C.UTF-8 en_US.UTF-8 zh_CN.UTF-8 de_DE.UTF-8
        de_CH.UTF-8 fr_CA.UTF-8 ps_AF.UTF-8 tr_TR.UTF-8
        en_HK.UTF-8 zh_CN.GBK cs_CZ.ISO-8859-2 ru_RU.KOI8-R
      # A sanitizer run costs several times a plain one, so this is the three
      # locales where a sanitizer has something specific to say: a separator
      # that is a single high byte in a signed char, a non-UTF-8 multibyte
      # charmap, and the multibyte-decimal-point fallback.
      IOV2_LOCALES_SAN: >-
        cs_CZ.ISO-8859-2 zh_CN.GBK ps_AF.UTF-8

    steps:
    - uses: actions/checkout@v6

    - name: Runner capacity
      run: |
        # The denominator for every timing in this log, and what any
        # $(nproc) in this job resolves to.
        echo "cpus=$(nproc) ram=$(free -m | awk '/^Mem:/ {print $2}')MB arch=$(uname -m)"

    - name: Configure and build (Release)
      run: |
        cmake --preset ${{ matrix.preset }}-release
        cmake --build --preset ${{ matrix.preset }}-release --parallel $(nproc)

    - name: Run tests (Release)
      run: ctest --preset ${{ matrix.preset }}-release --parallel $(nproc)

    - name: Run tests (Release) across locales
      run: |
        # No reconfigure and no rebuild: the only variable is the process
        # locale. Compiling once and re-running is what makes several locales
        # affordable at all.
        #
        # Why this exists: nothing else in the workflow leaves the C locale --
        # the container sets no LANG, and the install-paths job pins LC_ALL=C.
        # So a green pipeline used to say nothing about any other locale, while
        # the library's facets are precisely the code that reads them.
        for loc in $IOV2_LOCALES; do
          # glibc does not fail on an unknown locale: it warns on stderr and
          # silently falls back to C. Without this check, losing locales-all
          # from the image would turn the whole matrix into N more C runs --
          # green, and testing nothing.
          if [ -n "$(LC_ALL="$loc" locale charmap 2>&1 >/dev/null)" ]; then
            echo "[!] locale $loc is not available in this image"; exit 1
          fi
          echo "=== LC_ALL=$loc (charmap $(LC_ALL="$loc" locale charmap))"
          LC_ALL="$loc" ctest --preset ${{ matrix.preset }}-release --parallel $(nproc) \
            || { echo "[!] ctest failed under LC_ALL=$loc"; exit 1; }
        done

    - name: Configure and build (Sanitizers)
      run: |
        cmake --preset ${{ matrix.preset }}-sanitizer
        cmake --build --preset ${{ matrix.preset }}-sanitizer --parallel $(nproc)

    - name: Run tests (Sanitizers)
      run: ctest --preset ${{ matrix.preset }}-sanitizer --parallel $(nproc)
      env:
        ASAN_OPTIONS: halt_on_error=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    - name: Run tests (Sanitizers) across locales
      run: |
        # Again no rebuild -- the sanitizer binaries from the previous step are
        # reused. This pairing is the point: the locale-dependent paths are
        # where a stray byte becomes an out-of-range index, and only a
        # sanitizer run reports that rather than quietly producing wrong text.
        for loc in $IOV2_LOCALES_SAN; do
          if [ -n "$(LC_ALL="$loc" locale charmap 2>&1 >/dev/null)" ]; then
            echo "[!] locale $loc is not available in this image"; exit 1
          fi
          echo "=== LC_ALL=$loc (charmap $(LC_ALL="$loc" locale charmap))"
          LC_ALL="$loc" ctest --preset ${{ matrix.preset }}-sanitizer --parallel $(nproc) \
            || { echo "[!] ctest failed under LC_ALL=$loc"; exit 1; }
        done
      env:
        ASAN_OPTIONS: halt_on_error=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    - name: Run memory check (Valgrind)
      run: |
        # Both compilers, because they produce different code for Valgrind to
        # walk.
        #
        # --test-dir, not --preset: -T memcheck puts ctest in dashboard mode,
        # which resolves the project directory from the working directory and
        # ignores a test preset's binaryDir. Given --preset it looks for
        # DartConfiguration.tcl beside the sources, does not find it, and fails
        # with "Memory checker (MemoryCheckCommand) not set".
        #
        # A memcheck run that only writes logs and stays green would be worse
        # than no check at all, so this exact command was verified against a
        # program that leaks 64 bytes and writes past a 4-byte buffer: ctest
        # reported "Defects: 3" and exited 16. The exit code is the guard; no
        # file under Testing/Temporary carries the defect count to grep for.
        ctest --test-dir build/${{ matrix.preset }}-release -T memcheck \
              --output-on-failure -L all --parallel $(nproc)

  thread-safety:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/liwei-cpp/iov2-ci-gcc15:latest
    steps:
    - uses: actions/checkout@v6

    - name: Runner capacity
      run: |
        # The denominator for every timing in this log, and what any
        # $(nproc) in this job resolves to.
        echo "cpus=$(nproc) ram=$(free -m | awk '/^Mem:/ {print $2}')MB arch=$(uname -m)"

    - name: Run concurrency tests under ThreadSanitizer
      run: |
        # Only the concur suite is built. It collects every test that actually
        # runs threads -- TSan has nothing to observe in a single-threaded test,
        # so building the rest would cost minutes to inspect executions that
        # cannot race. Devices/converters/facets document concurrency as a
        # higher-level concern and are deliberately out of scope.
        #
        # The test preset repeats it ten times, because a race is only reported
        # when the schedule actually exercises it -- a single clean run is
        # weaker evidence than several. The reverse direction is reliable: TSan
        # is a happens-before detector and does not invent races, so a red here
        # is a real defect rather than CI flake.
        #
        # Deliberately not --parallel: the preset selects a single test, so
        # there is nothing to overlap, and leaving the other cores idle is the
        # point -- the ten repeats are looking for a schedule that exposes a
        # race, and competing for cores with nothing would only change that
        # schedule for reasons unrelated to the code under test.
        cmake --preset gcc-tsan
        cmake --build --preset gcc-tsan --parallel $(nproc)
        ctest --preset gcc-tsan
      env:
        TSAN_OPTIONS: halt_on_error=1:exitcode=66:history_size=7

  coverage:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/liwei-cpp/iov2-ci-gcc15:latest
    steps:
    - uses: actions/checkout@v6

    - name: Runner capacity
      run: |
        # The denominator for every timing in this log, and what any
        # $(nproc) in this job resolves to.
        echo "cpus=$(nproc) ram=$(free -m | awk '/^Mem:/ {print $2}')MB arch=$(uname -m)"

    - name: Generate Coverage Report
      run: |
        cmake --preset gcc-coverage
        cmake --build --preset gcc-coverage --parallel $(nproc)
        ctest --preset gcc-coverage --parallel $(nproc)
        lcov --capture --directory build/gcc-coverage --output-file coverage.info \
             --ignore-errors mismatch --ignore-errors inconsistent --ignore-errors negative
        # Anchored at the repo. The pattern this replaced, '*/include/*', also
        # matched /usr/local/include/c++/..., so ~110 libstdc++ headers rode
        # along in every upload; Codecov discarded them for not being repo
        # files, which is why the published number never showed it.
        lcov --extract coverage.info "${PWD}/include/*" --output-file coverage.info \
             --ignore-errors unused
        lcov --list coverage.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: coverage.info
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload coverage.info
      # Codecov publishes a percentage; comparing a refactor against a baseline
      # needs the line set, which only the file itself carries.
      uses: actions/upload-artifact@v4
      with:
        name: coverage-cmake
        path: coverage.info

  install-paths:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/liwei-cpp/iov2-ci-gcc15:latest
    steps:
    - uses: actions/checkout@v6

    - name: Runner capacity
      run: |
        # The denominator for every timing in this log, and what any
        # $(nproc) in this job resolves to.
        echo "cpus=$(nproc) ram=$(free -m | awk '/^Mem:/ {print $2}')MB arch=$(uname -m)"

    # The install itself is the root Makefile's job and stays that way; only
    # the suite that is then run against it moved to CTest.

    - name: Build the shared library
      run: make shared

    - name: Verify no unexpected runtime dependencies
      run: |
        # iov2_objects.cpp pulls in none of the optional converters, so the .so
        # must not depend on zlib/Botan.
        if readelf -d libiov2.so | grep -Eiq 'libz|libbotan'; then
          echo "libiov2.so unexpectedly links zlib/Botan"; exit 1
        fi

    - name: Install the shared library
      run: |
        make install-shared PREFIX=/opt/iov2
        # install-shared flips the switch in the shipped header.
        grep -q '^#define IOV2_SHARED 1' /opt/iov2/include/common/iov2_export.h

    - name: Run the full test suite against the installed shared library
      run: |
        # Consume libiov2 the real-user way: installed headers (switch already
        # on) + pkg-config for cflags/libs, with the source tree's include/ off
        # the search path entirely.
        export PKG_CONFIG_PATH=/opt/iov2/lib/pkgconfig
        export LD_LIBRARY_PATH=/opt/iov2/lib
        export LC_ALL=C   # tests assume the C locale (default boolalpha names, etc.)
        cmake --preset gcc-installed-shared
        cmake --build --preset gcc-installed-shared --parallel $(nproc)
        ctest --preset gcc-installed-shared --parallel $(nproc)

    - name: Install + consume in header-only mode (via pkg-config iov2)
      run: |
        # The header-only install path (make install + iov2.pc) is distinct from
        # the -I include path the build and coverage jobs use; exercise it so the
        # install target, iov2.pc, and the shipped switch-off header stay covered.
        make install PREFIX=/opt/iov2-ho
        # Header-only: the shipped switch must stay commented out. This and the
        # grep above are each other's control -- run against the other install,
        # either one fails.
        if grep -q '^#define IOV2_SHARED 1' /opt/iov2-ho/include/common/iov2_export.h; then
          echo "header-only install must NOT flip the IOV2_SHARED switch"; exit 1
        fi
        # Written outside the repo: this job also configures CMake in this tree.
        smoke=$(mktemp -d)
        printf '%s\n' '#include <io/objects/out_impl.h>' \
          'int main() { IOv2::cout << "iov2 header-only ok\n"; return 0; }' \
          > "$smoke/consumer_ho.cpp"
        export PKG_CONFIG_PATH=/opt/iov2-ho/lib/pkgconfig
        g++ -std=c++23 -D_POSIX_C_SOURCE=200809L $(pkg-config --cflags iov2) \
            "$smoke/consumer_ho.cpp" -o "$smoke/consumer_ho" $(pkg-config --libs iov2)
        "$smoke/consumer_ho" | grep -q 'iov2 header-only ok'

    - name: Run the full test suite against the installed header-only library
      run: |
        export PKG_CONFIG_PATH=/opt/iov2-ho/lib/pkgconfig
        export LC_ALL=C
        cmake --preset gcc-installed-header-only
        cmake --build --preset gcc-installed-header-only --parallel $(nproc)
        ctest --preset gcc-installed-header-only --parallel $(nproc)

    - name: Verify the installed modes used no source-tree headers
      run: |
        # The point of both modes is that include/ in the repo is not consulted.
        # CMakeLists.txt refuses a pkg-config prefix inside the source tree; this
        # checks the commands that were actually issued.
        for d in gcc-installed-shared gcc-installed-header-only; do
          if grep -q -- "-I${PWD}/include" build/$d/compile_commands.json; then
            echo "[!] $d compiled against the source tree"; exit 1
          fi
          echo "OK: $d used no source-tree headers"
        done
        if grep -q -- '-liov2' build/gcc-installed-header-only/compile_commands.json; then
          echo "[!] header-only mode linked libiov2"; exit 1
        fi

  clang-tidy:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/liwei-cpp/iov2-ci-gcc15:latest
    steps:
    - uses: actions/checkout@v6

    - name: Runner capacity
      run: |
        # The denominator for every timing in this log, and what any
        # $(nproc) in this job resolves to.
        echo "cpus=$(nproc) ram=$(free -m | awk '/^Mem:/ {print $2}')MB arch=$(uname -m)"

    - name: Run clang-tidy
      run: |
        # Use default clang-tidy from the image (which will be a recent version)
        clang-tidy $(find include/common include/device include/cvt include/facet include/locale include/io/utilities -name '*.h') \
          include/io/streambuf.h include/io/streambuf_iterator.h include/io/io_concepts.h include/io/io_base.h \
          include/io/io_manip.h include/io/istream.h include/io/ostream.h include/io/iostream.h \
          --checks='bugprone-*,performance-*,modernize-*,cppcoreguidelines-*,-modernize-use-trailing-return-type,-cppcoreguidelines-avoid-magic-numbers,-cppcoreguidelines-pro-bounds-pointer-arithmetic,-cppcoreguidelines-pro-bounds-constant-array-index,-cppcoreguidelines-avoid-non-const-global-variables,-cppcoreguidelines-pro-bounds-avoid-unchecked-container-access,-clang-diagnostic-pragma-once-outside-header' \
          --warnings-as-errors='bugprone-*' \
          -- -std=c++23 -x c++ -I include -I /usr/include -I /usr/include/botan-2

